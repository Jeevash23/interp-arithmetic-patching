[project]
name = "compositional-value-transfer"
version = "0.1.0"
description = "Controlled intermediate-value interchange during fresh language-model generation"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.13.0", "transformers==5.16.1", "transformer-lens==3.8.0", "numpy==2.5.2", "scipy==1.18.1", "matplotlib==3.11.1", "huggingface-hub==1.29.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
